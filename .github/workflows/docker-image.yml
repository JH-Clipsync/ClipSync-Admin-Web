name: Build & Deploy Web

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SIGN_STATIC_SECRET: clipsync-admin-static-sign-secret-v1

      - name: 打包 dist
        run: tar -czf dist.tar.gz -C dist .

      - name: 通过 scp 上传到服务器
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "dist.tar.gz"
          target: "/tmp/clipsync-admin-web"
          overwrite: true

      - name: 通过 SSH 解压到 web 目录
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_ADMIN_DIR || '/app/Clipsync/admin' }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_DIR
          script_stop: true
          script: |
            set -e
            if [ "$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
            WEB_DIR="$DEPLOY_DIR/web"
            echo "==> 部署前端到 $WEB_DIR"
            $SUDO mkdir -p "$WEB_DIR"
            if [ -d "$WEB_DIR" ] && [ "$(ls -A "$WEB_DIR" 2>/dev/null)" ]; then
              $SUDO rm -rf "${WEB_DIR}.bak"
              $SUDO cp -r "$WEB_DIR" "${WEB_DIR}.bak"
            fi
            $SUDO find "$WEB_DIR" -mindepth 1 -delete
            $SUDO tar -xzf /tmp/clipsync-admin-web/dist.tar.gz -C "$WEB_DIR"
            $SUDO chown -R root:root "$WEB_DIR"
            rm -rf /tmp/clipsync-admin-web
            echo "==> 前端部署完成："
            $SUDO ls -la "$WEB_DIR" | head -20
